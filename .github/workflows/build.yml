name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          security create-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          if [ -z "$SIGNING_P12" ]; then echo "::error::Add the SIGNING_P12 and SIGNING_PASSWORD repository secrets"; exit 1; fi
          # Pasting into GitHub can add spaces or line breaks; neither value contains any
          printf %s "$SIGNING_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/signing.p12"
          PW=$(printf %s "$SIGNING_PASSWORD" | tr -d '[:space:]')
          echo "key file sha1: $(shasum "$RUNNER_TEMP/signing.p12" | cut -c1-12), password length: ${#PW}"
          security import "$RUNNER_TEMP/signing.p12" -k build.keychain -P "$PW" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          security find-identity -p codesigning build.keychain
      - run: ./build.sh
        env:
          SIGN_ID: Console Mode Signing
      - uses: actions/upload-artifact@v4
        with:
          name: Console-Mode
          path: build/Console-Mode.zip
      - name: Publish release (used by the in-app updater)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Console Mode.app/Contents/Info.plist")
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" build/Console-Mode.zip --title "Console Mode $VER" --notes "Console Mode $VER"
          fi
