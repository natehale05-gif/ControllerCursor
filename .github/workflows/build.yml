name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Console-Mode
          path: build/Console-Mode.zip
